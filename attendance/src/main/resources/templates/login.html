<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <!-- Optional simple styling -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: white;
            padding: 24px;
            border-radius: 8px;
            width: 300px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }
        button {
            background: #4b5563;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background: #111827;
        }
        .error {
            color: red;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Login</h2>

    <form id="loginForm">
        <input type="email" name="email" placeholder="Email" required />
        <input type="password" name="password" placeholder="Password" required />
        <button type="submit">Login</button>
    </form>

    <div id="errorMsg" class="error"></div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function (e) {
        e.preventDefault();

        const formData = new FormData(this);

        fetch('api/login', {
            method: 'POST',
            body: formData,
            credentials: 'same-origin'   // IMPORTANT for session
        })
            .then(res => {
                if (!res.ok) {
                    throw new Error('Login failed');
                }

                // Login success → go to dashboard page
                window.location.href = '/dashboard';
            })
            .catch(() => {
                document.getElementById('errorMsg').textContent =
                    'Invalid email or password';
            });
    });
</script>

</body>
</html>
